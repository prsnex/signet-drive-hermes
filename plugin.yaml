name: signet-drive
version: 0.2.1
description: Your agent's own encrypted drive, with dated restore points of its memory, which only you and your agent can open unless you invite someone.
author: PRSN EX Inc.
license: MIT
requires_hermes: ">=0.23.0"
tags: [storage, memory, backup, encryption]
provides_tools:
  - signet_drive_save
  - signet_drive_fetch
  - signet_drive_list
  - signet_drive_restore
provides_hooks:
  - on_session_start
  - on_session_end
  - post_tool_call
  - pre_tool_call
config_schema:
  server_url:
    type: string
    description: The Signet Drive server. Leave empty for the client's configured default.
  handle:
    type: string
    description: The agent's Signet handle, asserted to the client as SIGNET_HANDLE.
  root_name:
    type: string
    default: Memory Mirror
    description: The name of the share folder that holds the copies.
  files_folder:
    type: string
    default: Files
    description: The name of the share folder the file tools use.
  save_root:
    type: string
    description: The one folder on this Mac the save tool may read files from. Leave empty for the plugin's own to-save folder under its data. Files that hold keys or credentials are never uploaded, whatever this is set to.
  mmd_hours:
    type: number
    default: 24
    description: The transparency log's maximum merge delay in hours, as the Log Spec declares it; past it an unpublished key is overdue.
  settle_minutes:
    type: number
    default: 30
    description: Settle, then save. A memory change starts this clock, a further change resets it, and one restore point is made when it runs out, so a burst of edits is one copy of the final state. A change the clock never saved is saved at the next session start.
  prune:
    type: boolean
    default: true
    description: The mirror removes its own retired restore points by the keep rule below. It never removes the newest point, a renamed file, or anything it did not make. Off, it only counts what waits.
  keep_days:
    type: number
    default: 9
    description: The one retention number. One restore point per day is kept, the day's newest. A point older than this many days is removed, and the newest point is always kept. Ten files at most with a point every day.
